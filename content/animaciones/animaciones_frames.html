<!doctype html>
<html lang="es">
<head>  
    <style>
        #c1{
            width: 200px;
            height: 200px;
            position: absolute;
            top: 0px;
            left: 0px;
            border: 4px solid red;
            animation: animacion1 2s;
            animation-iteration-count: infinite; /*repetir la animacion infinitamente*/
        }

        /*@keyframes animacion1
        {
            0% {top: 200px; left: 200px; background-color: red;}
            25% {top: 200px; left: 400px; background-color: blue;}
            50% {top: 400px; left: 200px; background-color: green;}
            75% {top: 400px; left: 400px; background-color: yellow;}
            100% {top: 200px; left: 200px; background-color: red;}
        }*/


        @keyframes animacion1
        {
            from
            {
                top: 300px;
                left: 300px;
                width: 200px;
                height: 200px;
                background-color: red;
            }
            50%
            {
                top:200px;
                left: 500px;
                width: 200px;
                height: 200px;
                background-color: red;
            }
            to
            {
                top: 400px;
                left: 400px;
                width: 200px;
                height: 200px;
                background-color: red;
            }
        }

    </style>
</head>

<body>
    <h1>Ejemplo de keyframes</h1>
    <br>
    <div id="c1"> Texto dentro de div</div>
    <br>

</body>
</html>
