<!doctype html>
<html lang="es">
<head>  
    <style>
        #c1
        {
            width: 200px;
            height: 200px;
            border: 2px solid red;
            transition: all 1s; /*transicion de 2 segundos para todas las propiedades*/
        }

        /*generamos la transicion*/
        #c1:hover
        {
            border: 4px solid blue;
            width: 600px;
            height: 600px;
            cursor: pointer;

        }
        #nombre
        {
            background-color: pink;
        }
        #nombre:focus
        {
            background-color: yellow;
            border: 2px solid orange;
        }

    </style>
</head>

<body>
    <h1>Animaciones</h1>
    <br>
    <div id="c1"> Texto dentro de capa</div>
    <br>
    <form>
        Introduce nombre
        <input type="text" name="nombre" id="nombre">
        <br>

</body>
</html>
