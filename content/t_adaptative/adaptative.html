<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
 
    <style>
 
        div{
            width: 600px;
            height: 400px;
            background-color: aqua;
            border:2px solid red;
        }
 
 
 
 
/*gestionamos desde la @meadi screen*/
        @media screen and (min-width:0px) and (max-width:600px) /*Interpretamos las reglas entre 0px de ancho y 600px*/
        {
            div
            {
                background-color: green;
                width: 50%;
                height: 400px;
            }
        }
 
 
 
        @media screen and (min-width:601px)/*Interpretamos las reglas entre 0px de ancho y 600px*/
        {
            div
            {
                background-color: orange;
                margin-left: 20%;
                width: 80%;
                height: 600px;
            }
        }
 
 
 
 
    </style>
 
 
 
</head>
 
<body>
    <h1>Ejemplo Mediaqueri</h1>
    <br>
    <div id="cuerpo">
 
    </div>
 
</body>
 
 
 
 
 
</html>
